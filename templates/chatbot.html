<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Secure HTML sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body class="chatbot-page">
<nav class="navbar">
    <div class="nav-logo">✦ Sangeetha</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/chatbot">Chatbot</a>
    </div>
</nav>
    <main class="chat-app">

        <!-- Header -->
        <header class="chat-header">

    <div class="brand">
        <div class="ai-icon">✦</div>

        <div class="brand-text">
            <h1>AI Assistant</h1>
        </div>
    </div>

    <!-- Header Actions -->
<div class="header-actions">
    <button id="historyBtn" class="history-btn" title="Chat history">☷</button>

    <!-- New Chat -->
    <button
        id="newChatBtn"
        class="new-chat-btn"
        title="Start a new chat">
        ✚
    </button>

    <!-- Theme Toggle -->
    <button
        id="themeToggle"
        class="theme-toggle"
        title="Switch theme">
        🌙
    </button>

</div>

</header>

<div id="historyPanel" class="history-panel">
    <div class="history-header">
        <h2>Chat History</h2>
        <button id="closeHistoryBtn" title="Close">×</button>
    </div>

    <div id="historyList" class="history-list">
        <!-- Saved chats will appear here -->
    </div>

    <button id="clearHistoryBtn" class="clear-history-btn">
        Clear all history
    </button>
</div>

        <!-- Chat Area -->
        <section id="chatbox"
                 class="chatbox">

            <div class="welcome-message">

                

                <h2>Hello! 👋</h2>

                <p>How can I help you today?</p>

                <div class="suggestions">

                    <button
                        onclick="messageInput.value='Explain Python'; sendMessage()">
                        💡 Explain Python
                    </button>

                    <button
                        onclick="messageInput.value='What is Artificial Intelligence?'; sendMessage()">
                        🤖 What is AI?
                    </button>

                    <button
                        onclick="messageInput.value='Give me a study tip'; sendMessage()">
                        📚 Study tip
                    </button>

                </div>

            </div>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading hidden">

    <span class="loading-text">AI is thinking</span>

    <span class="typing-dot"></span>
    <span class="typing-dot"></span>
    <span class="typing-dot"></span>

</div>


        <!-- Input Area -->
<div class="input-section">

    <div class="input-area">

        <!-- Message Input -->
        <input
            id="messageInput"
            type="text"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <!-- Generate Image Button -->
        <button
            id="imageBtn"
            class="image-btn"
            title="Generate an image">
            🖼️
        </button>

        <!-- Send Button -->
        <button
            id="sendBtn"
            class="send-btn"
            title="Send message">
            ➤
        </button>

        <!-- Clear Button -->
        <button
            id="clearBtn"
            class="clear-btn"
            title="Clear conversation">
            Clear
        </button>

    </div>

</div>


    </main>



<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
